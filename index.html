    <script>
      // Suppress Vite HMR WebSocket closed errors in AI Studio iframe environment
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(function(a) {
            return (a && (a.message || a.stack || a.toString())) ? (a.message || a.stack || a.toString()) : String(a);
          }).join(' ');
          if (msg.includes('WebSocket closed without opened') || msg.includes('vite-hmr') || msg.includes('@vite/client')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          const msg = event.message || (event.error && event.error.message) || '';
          if (msg.includes('WebSocket closed without opened') || msg.includes('WebSocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          const msg = (event.reason && (event.reason.message || String(event.reason))) || '';
          if (msg.includes('WebSocket closed without opened') || msg.includes('WebSocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
